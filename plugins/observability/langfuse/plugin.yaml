name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Hairball — traces conversations, LLM calls, and tool usage. Opt-in via `hairball plugins enable observability/langfuse` or `hairball tools → Langfuse Observability`."
author: Hairball
requires_env:
  - HAIRBALL_LANGFUSE_PUBLIC_KEY
  - HAIRBALL_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
